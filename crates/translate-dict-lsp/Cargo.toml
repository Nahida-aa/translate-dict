[package]
name = "translate-dict-lsp"
version.workspace = true
edition = "2021"
repository = "https://github.com/Nahida-aa/translate-dict"
build = "build.rs"

[[bin]]
name = "translate-dict-lsp"
path = "src/main.rs"

[dependencies]
ahash = "0.8"
include_dir = "0.7"
clap = "4.5.49"
arc-swap = "1.7"
serde = "1.0.228"
serde_json = "1.0.150"
tokio = { version = "1.48.0", features = ["io-std", "macros", "process", "rt-multi-thread"], default-features = false }
tower-lsp = "0.20.0"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
